[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyml-triton"
version = "0.1.0"
description = "GPT-2 implementation using custom Triton kernels"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "triton>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tinyml_triton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
